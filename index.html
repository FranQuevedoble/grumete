<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Grumete del Cuervo Insomne</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{--ab:#0b1d2a;--am:#f2a541;--sp:#2a9d8f;--hu:#efe9da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--ab);color:var(--hu);font-family:Spectral,'Cormorant Garamond',Georgia,serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:18px}
.bar button{background:none;border:0;color:var(--hu);font-size:22px;min-width:44px;min-height:44px}
.bar span{font-family:'IM Fell English SC',Georgia,serif;color:var(--am);font-size:16px}
.vig{position:relative;height:30%;min-height:150px;overflow:hidden;border-radius:0 0 30px 30px;background:linear-gradient(#16324a,#0b1d2a)}
.vig.storm{background:linear-gradient(#1b1f33,#05080f)}.vig.fog{background:linear-gradient(#4a6a6d,#16282c)}
.vig.dawn{background:linear-gradient(#e0803f,#2a4a63)}.vig.cabin{background:linear-gradient(#3a2412,#120b06)}
.vig.cabin .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(242,165,65,.55),transparent 60%)}
.vig.storm::after{content:"";position:absolute;inset:0;background:#cfe6ff;opacity:0;animation:fl 5s infinite}
@keyframes fl{0%,90%,100%{opacity:0}92%{opacity:.5}94%{opacity:0}96%{opacity:.3}}
.vig.fog::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(220,240,235,.35),transparent 60%),radial-gradient(ellipse at 80% 40%,rgba(220,240,235,.25),transparent 55%)}
.em{position:absolute;left:50%;top:42%;font-size:min(22vw,92px);transform:translate(-50%,-50%);animation:roc 4s ease-in-out infinite;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
@keyframes roc{50%{transform:translate(-50%,-50%) rotate(5deg)}0%,100%{transform:translate(-50%,-50%) rotate(-5deg)}}
.w{position:absolute;bottom:0;left:0;width:200%;height:46px;animation:wv 6s linear infinite}.w2{bottom:-10px;opacity:.7;animation-duration:9s;animation-direction:reverse}
@keyframes wv{to{transform:translateX(-12.5%)}}
#sc{flex:1;overflow:auto;padding:16px 20px 8px;font-size:19px;line-height:1.55}
#tx{white-space:pre-wrap}
h1{font-family:'IM Fell English SC',Georgia,serif;color:var(--am);font-weight:400;font-size:30px;margin:4px 0 10px;line-height:1.15}
input{width:100%;box-sizing:border-box;font:inherit;font-size:19px;padding:12px;border-radius:12px;border:1.5px solid var(--sp);background:rgba(255,255,255,.06);color:var(--hu);margin:8px 0}
#ops{display:grid;gap:10px;padding:8px 16px 16px;max-height:48vh;overflow:auto}
.op{min-height:56px;text-align:left;font:inherit;font-size:17px;color:var(--hu);background:rgba(242,165,65,.09);border:1.5px solid var(--am);border-radius:14px;padding:12px 16px;animation:up .35s both}
.op:active{background:rgba(242,165,65,.3)}.op:disabled{opacity:.4;border-color:#6b7b85}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.die{font-size:64px;text-align:center;animation:spin .9s}@keyframes spin{to{transform:rotate(720deg)}}
#menu{position:fixed;inset:0;background:rgba(5,12,18,.96);padding:calc(env(safe-area-inset-top,0px) + 16px) 22px 22px;overflow:auto;display:none;font-size:17px;line-height:1.5}
#menu.open{display:block}#menu h2{font-family:'IM Fell English SC',serif;color:var(--am);font-weight:400;margin:16px 0 4px}
#menu li{margin:4px 0}
</style></head><body>
<div id="app">
<div class="bar"><button id="mb" aria-label="Menú">☰</button><span>El Cuervo Insomne</span><div><span>🌻 <b id="pp">0</b></span> <button id="sb" aria-label="Sonido">🔊</button></div></div>
<div class="vig" id="vig"></div>
<div id="sc"><div id="tx"></div></div>
<div id="ops"></div>
</div>
<div id="menu"></div>
<script>
const $=id=>document.getElementById(id),AN={c:'Coraje',i:'Ingenio',l:'Labia'};
let G,ac,gm,mute=false,fin=null,tm,M='calm',E='⚓';
const S0=()=>({n:'Grumete',at:{c:1,i:1,l:1},conf:0,crew:0,mor:0,hp:0,fl:{},inv:[],pip:0,sc:'E1',dia:[]});
const save=()=>{try{localStorage.setItem('cuervo',JSON.stringify(G))}catch(e){}};
const load=()=>{try{return JSON.parse(localStorage.getItem('cuervo'))}catch(e){return null}};
const sub=s=>s.replace(/\{n\}/g,G.n);
const hud=()=>$('pp').textContent=G?G.pip:0;
function snd(){try{if(ac)return;ac=new(window.AudioContext||webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.frequency.value=500;gm=ac.createGain();gm.gain.value=mute?0:.25;const o=ac.createOscillator();o.frequency.value=.12;const og=ac.createGain();og.gain.value=.12;o.connect(og).connect(gm.gain);s.connect(f).connect(gm).connect(ac.destination);s.start();o.start()}catch(e){}}
function bell(){try{if(!ac||mute)return;[0,1.6].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=196;g.gain.setValueAtTime(.3,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+2.5);o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+2.6)})}catch(e){}}
const vb=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function vig(m,e){M=m;E=e;const p='M0 30 Q50 5 100 30 T200 30 T300 30 T400 30 T500 30 T600 30 T700 30 T800 30 V60H0Z';$('vig').className='vig '+m;$('vig').innerHTML=`<div class=glow></div><div class=em>${e}</div><svg class="w w2" viewBox="0 0 800 60" preserveAspectRatio="none"><path d="${p}" fill="#2a9d8f" opacity=".5"/></svg><svg class=w viewBox="0 0 800 60" preserveAspectRatio="none"><path d="${p}" fill="#0b1d2a" opacity=".8"/></svg>`}
function type(txt,done){clearInterval(tm);const el=$('tx');let i=0;el.textContent='';fin=()=>{clearInterval(tm);el.textContent=txt;fin=null;done()};tm=setInterval(()=>{i+=2;el.textContent=txt.slice(0,i);if(i>=txt.length)fin()},22)}
$('sc').onclick=()=>fin&&fin();
const met=r=>!r||(r.a?G.at[r.a]>=r.v:G.pip>=r.p);
function show(txt,ops,m,e){vig(m,e);$('ops').innerHTML='';$('sc').scrollTop=0;type(txt,()=>{ops.forEach(o=>{const b=document.createElement('button');b.className='op';b.textContent=(o.req?(o.req.a?`[${AN[o.req.a]} ${o.req.v}] `:'[1 pipa] '):'')+sub(o.t);b.disabled=!met(o.req);b.onclick=()=>pick(o);$('ops').appendChild(b)})})}
function fx(f){if(!f)return;for(const k of['conf','crew','mor','hp'])if(f[k])G[k]+=f[k];G.conf=Math.max(-3,Math.min(3,G.conf));G.hp=Math.max(0,G.hp);if(f.p){G.pip=Math.max(0,G.pip+f.p);hud()}if(f.f)G.fl[f.f]=1;if(f.i){f.i[0]==='-'?G.inv=G.inv.filter(x=>x!==f.i.slice(1)):G.inv.push(f.i)}if(f.d)G.dia.push(f.d)}
function go(id){if(id==='E0')return intro();const s=SC[id];G.sc=id;if(s.p&&!G.fl['p'+id]){G.fl['p'+id]=1;fx({p:s.p})}if(s.fx&&!G.fl['x'+id]){G.fl['x'+id]=1;fx(s.fx)}if(s.snd){bell();vb([80,60,80])}if(s.end){vb([200,80,200]);try{const a=JSON.parse(localStorage.getItem('cuervoSet')||'[]');if(!a.includes(s.end)){a.push(s.end);localStorage.setItem('cuervoSet',JSON.stringify(a));localStorage.setItem('cuervoEnds',a.length)}}catch(e){}}save();show(sub(typeof s.t==='function'?s.t():s.t),s.o.filter(o=>!(o.h&&G.fl[o.h])&&(!o.if||G.fl[o.if])&&(!o.c||o.c())),s.m,s.e)}
function pick(o){if(o.r)return roll(o);fx(o.fx);if(o.x)return show(sub(o.x),[{t:'Continuar',go:o.go}],M,E);go(o.go)}
function roll(o){const r=o.r,d=1+Math.random()*6|0,tot=d+G.at[r.a],ok=tot>=r.d;vb(60);$('ops').innerHTML='';$('tx').innerHTML='<div class=die>🎲</div>';setTimeout(()=>{fx(ok?r.okfx:r.kofx);if(!ok)vb([120,50,120]);if(!ok&&r.dead&&G.hp>=2)return go(r.dead);show(`🎲 ${d} + ${AN[r.a]} ${G.at[r.a]} = ${tot} (hacía falta ${r.d}) — ${ok?'¡Lo logras!':'Fallas.'}\n\n`+sub(ok?r.okx:r.kox),[{t:'Continuar',go:r.go}],M,E)},900)}
function intro(){const sv=load();vig('calm','🦜⚓');$('tx').innerHTML='<h1>El Grumete del Cuervo Insomne</h1>Una noche de tormenta, un camarote por fregar y una brújula que no debería existir.<input id="nm" placeholder="Tu nombre de grumete" maxlength="14">';$('ops').innerHTML='';const add=(t,f)=>{const b=document.createElement('button');b.className='op';b.textContent=t;b.onclick=f;$('ops').appendChild(b)};
let ends=0;try{ends=+localStorage.getItem('cuervoEnds')||0}catch(e){}
if(sv&&sv.sc!=='E1')add('Continuar aventura',()=>{snd();G=sv;hud();go(G.sc)});
[['Huérfano del puerto (+1 Ingenio)','i'],['Polizón (+1 Coraje)','c'],['Hijo de una cantante de taberna (+1 Labia)','l']].forEach(([t,a])=>add(t,()=>{snd();G=S0();G.n=($('nm').value||'Grumete').trim();G.at[a]++;hud();$('tx').innerHTML='<h1>Un punto más</h1>Cada marinero presume de algo. ¿De qué presumes tú?<br><br>Finales desbloqueados: '+ends+'/7';$('ops').innerHTML='';[['Coraje','c'],['Ingenio','i'],['Labia','l']].forEach(([n,k])=>add('+1 '+n,()=>{G.at[k]++;go('E1')}))}))}
$('mb').onclick=()=>{if(!G)return;const m=$('menu');m.innerHTML=`<button class=op onclick="$('menu').classList.remove('open')">Cerrar ✕</button><h2>Estadísticas</h2>${G.n}: Coraje ${G.at.c}, Ingenio ${G.at.i}, Labia ${G.at.l}<br>Confianza de la Capitana ${G.conf} · Tripulación ${G.crew} · Heridas ${G.hp}<h2>Inventario</h2>🌻 ${G.pip} pipas<ul>${G.inv.map(i=>'<li>'+i+'</li>').join('')}</ul><h2>Diario</h2><ul>${G.dia.map(i=>'<li>'+i+'</li>').join('')||'<li>Aún no has descubierto nada.</li>'}</ul>`;m.classList.add('open')};
$('sb').onclick=()=>{mute=!mute;$('sb').textContent=mute?'🔇':'🔊';if(gm)gm.gain.value=mute?0:.25};
const SC={
E1:{m:'cabin',e:'🕯️',t:'La tormenta golpea el casco del Cuervo Insomne como un puño grande y torpe. Tú, {n}, de rodillas en el camarote de la Capitana, friegas tablas que huelen a ron, brea y secretos viejos. El farol se balancea. Sobre el respaldo de la silla, Pipas, el guacamayo, te vigila con un ojo mientras mordisquea algo que seguro no es suyo.\n\nTodavía queda mucha noche y mucho suelo.',o:[
{t:'Ordenar los mapas de la mesa',h:'mp',fx:{f:'mp',p:1,d:'En un mapa, una isla con forma de tortuga y una frase tachada: «No despiertes lo que respira».'},x:'Mapas de aguas que nadie nombra. En uno, una isla con forma de tortuga lleva una frase en el margen: «No despiertes lo que respira». Alguien la tachó con furia. Entre los pliegues encuentras una pipa olvidada.',go:'E1'},
{t:'Darle una pipa a Pipas',h:'pp',req:{p:1},fx:{p:-1,f:'pp',d:'Pipas: la Capitana habla en sueños y siempre dice «Elías».'},x:'Pipas parte la pipa de un chasquido. «Generoso. Sospechoso, pero generoso. Te diré algo gratis, {n}: la Capitana habla en sueños, y siempre dice el mismo nombre. Elías.»\n\nSe te encoge el estómago. Disimulas.',go:'E1'},
{t:'Curiosear el baúl de la Capitana',h:'bl',r:{a:'i',d:6,go:'E1',okfx:{f:'bl',d:'En el baúl de la Capitana: un pañuelo bordado con una E.'},okx:'La cerradura cede con un clic satisfecho. Dentro, un pañuelo bordado con una E y una carta sin enviar. No te da tiempo a leerla.',kofx:{f:'bl',conf:-1},kox:'Un crujido a tu espalda: Cuchillo, en la puerta, te ha visto con las manos en el baúl. «La Capitana no lo sabrá por mí», dice. Lo dice como quien guarda una moneda.'}},
{t:'Fregar el suelo junto a la mesa de cartas',go:'E2'}]},
E2:{m:'cabin',e:'🧭',p:1,t:'Al frotar bajo la mesa, el cepillo se engancha: una tabla suelta. Debajo, envuelta en un trapo, una brújula de latón. Dos letras grabadas en la tapa: E.M.\n\nLa abres. La aguja no busca el norte. Gira, tiembla y se detiene apuntando a tu pecho. Del cristal sale un susurro, tan bajo que podría ser el mar.\n\n«Eso no es tuyo», dice Pipas, bajando la voz por primera vez. «Y mira que yo soy ladrón de primera.»',o:[
{t:'Guardarte la brújula en el bolsillo',fx:{i:'Brújula E.M.',d:'Encontré una brújula grabada «E.M.» cuya aguja me señala a mí.'},go:'E3'},
{t:'Preguntarle a Pipas por «E.M.» antes de guardarla',fx:{i:'Brújula E.M.',d:'Pipas: E.M. es Elías Marrero, contramaestre desaparecido hace diez años. Nadie dice su nombre a bordo.'},x:'Pipas se encoge sobre la percha. «Elías Marrero. Contramaestre del Cuervo. Desapareció hace diez años en una noche como esta. A bordo nadie dice su nombre.» Te mira de lado. «¿Y tú por qué preguntas, {n}?»\n\nNo contestas. Te metes la brújula en el bolsillo.',go:'E3'}]},
E3:{m:'fog',e:'🔔',snd:1,t:'De pronto, el mundo se queda sin ruido. El barco no cabecea, la lluvia no cae, el viento ya no silba. Por las rendijas entra una niebla fría y verdosa. Y debajo del agua, muy lejos, una campana toca una vez. Otra. Otra más, cada vez más cerca.\n\nLa brújula late en tu mano como un corazón asustado.',o:[
{t:'Asomarte al ojo de buey',r:{a:'c',d:6,go:'E4',okfx:{f:'vioReq',d:'Vi el galeón fantasma «El Réquiem» por el ojo de buey.'},okx:'Un casco enorme de madera negra emerge de la niebla, con las velas hechas jirones y faroles azules. En la proa, el nombre: EL RÉQUIEM. Aguantas la mirada sin gritar.',kofx:{hp:1},kox:'Pegada al cristal, una cara hinchada y gris te sonríe con la boca llena de agua. Caes de espaldas sin aire y te das un golpe seco.'}},
{t:'Gritar para dar la alarma',fx:{crew:1},x:'Tu grito rompe el silencio y arriba alguien responde con otro. Ganas unos segundos... y también la atención de quien menos querías.',go:'E4'},
{t:'Esconderte bajo la mesa con Pipas',fx:{f:'oculto'},x:'«Idea brillante», susurra Pipas. «Llevo toda la vida practicando.» Os quedáis quietos, sin respirar, hasta que la puerta se abre.',go:'E4'}]},
E4:{m:'cabin',e:'🗡️',t:'La puerta se abre de golpe. Bruno «Cuchillo» Valdés, el contramaestre, entra empapado, con la daga en la mano y los ojos fijos en la tabla suelta.\n\n«Dámela, grumete. Sin ruido y sin preguntas. Esta noche mueren hombres por esa brújula, y no quiero que seas tú.»\n\nTe sonríe como quien ofrece un trago y esconde un cuchillo.',o:[
{t:'Entregarle la brújula',fx:{i:'-Brújula E.M.',crew:1,conf:-1,f:'dioBr',d:'Entregué la brújula a Cuchillo.'},x:'Cuchillo la guarda sin mirarla. «Buen chico. Recuerda quién te ayudó esta noche.» Sale, y desde cubierta se oye el primer grito.',go:'E5'},
{t:'Mentir: «No sé de qué me hablas»',r:{a:'l',d:7,go:'E5',okfx:{crew:1},okx:'Pones cara de grumete inocente: la tabla ya estaba suelta, el cubo la hizo saltar. Cuchillo te estudia... y se ríe. «Pues buscaré en otro sitio.» Sale con prisa.',kofx:{hp:1,i:'-Brújula E.M.',f:'dioBr',conf:-1},kox:'Cuchillo te agarra del cuello, te registra y se lleva la brújula. «Mala mentira, mejor chico.» Te empuja contra la mesa.'}},
{t:'Golpearle con el cubo',r:{a:'c',d:7,go:'E5',okfx:{crew:-1},okx:'El cubo le da en plena cara con un campanazo. Cuchillo cae de rodillas, jurando en tres idiomas. Corres.',kofx:{hp:1,i:'-Brújula E.M.',f:'dioBr'},kox:'Fallas por un palmo. Cuchillo te desarma de un manotazo, te arranca la brújula y huye hacia cubierta.'}},
{t:'Huir por la ventana de popa',r:{a:'i',d:6,go:'E5',okx:'Te cuelas por el ventanal, trepas por los cabos del timón, el aire frío en la cara. Llegas a cubierta antes que él.',kofx:{hp:1},kox:'Resbalas en la madera mojada y casi te caes al mar. Te agarras de un dedo. Cuando subes, te sangran las manos.'}}]},
E5:{m:'storm',e:'⚓',t:'Cubierta. Los Ahogados trepan por la borda del Cuervo: marineros de agua salada, con algas por pelo y ganchos oxidados, sin dejar de gotear. Detrás, el galeón fantasma se arrima entre rayos azules. La tripulación pelea a gritos. Pipas vuela sobre ti graznando órdenes que nadie ha pedido.\n\nEn medio del caos, ¿dónde puedes ser útil?',o:[
{t:'Disparar el cañón de babor',r:{a:'c',d:7,go:'E6',okfx:{crew:2,f:'canon'},okx:'Enciendes la mecha con las manos temblando. El disparo abre un hueco humeante en el casco del Réquiem y los Ahogados se deshacen en espuma. Oyes vítores.',kofx:{hp:1},kox:'La mecha se apaga y el cañón solo escupe humo. Un Ahogado te lanza al suelo; te levantas con un moratón enorme.'}},
{t:'Cortar los cabos de abordaje',r:{a:'i',d:6,go:'E6',okfx:{crew:1,f:'cabos'},okx:'Ves que todos los ganchos tiran del mismo punto. Cortas el nudo maestro y media docena de cabos se sueltan con un chasquido. Los Ahogados caen al mar.',kofx:{hp:1},kox:'El cabo cede, pero te arrastra: te llevas un latigazo en las costillas.'}},
{t:'Correr a salvar a Ximena en la cocina',r:{a:'l',d:6,go:'E6',okfx:{mor:1,f:'ximena',d:'Salvé a Madame Ximena en la cocina.'},okx:'Madame Ximena está acorralada entre dos Ahogados. Les gritas la mentira más grande de tu vida: que el Almirante los espera en cubierta. Dudan, y ella los golpea con una sartén. «Eres un cielo, criatura. Te debo una sopa.»',kofx:{hp:1},kox:'Llegas tarde: Ximena ya se ha librado sola con un cucharón, pero un Ahogado te alcanza antes de que huyas.'}}]},
E6:{m:'storm',e:'👩‍✈️',t:()=>'Entre el humo y la espuma aparece la Capitana Inés Calavera, «la Marea», con el sombrero de pluma de gaviota empapado y el sable en la mano. '+(G.fl.dioBr?'Con la otra arranca la brújula del cinturón de Cuchillo, que se queda mudo. Ella la mira y su cara se queda sin color.':'Se detiene al ver la brújula en tu mano, y su cara se queda sin color.')+'\n\n—¿De dónde ha salido esto? —Su voz es un hilo—. Habla, grumete. ¿Quién eres tú de verdad?',o:[
{t:'Decirle la verdad: eres hijo de Elías Marrero',fx:{f:'verdad',conf:2,d:'Le dije a la Capitana que soy hijo de Elías Marrero.'},x:'La Capitana cierra los ojos un instante, como si esperase desde hace diez años que alguien dijese esa frase. «Tienes sus ojos», dice. «Y su mala suerte. Sígueme.»',go:'E7'},
{t:'Callar: la encontraste por casualidad',fx:{f:'oculto2',d:'Le oculté a la Capitana quién soy.'},x:'«La encontraste, claro.» No te cree, pero tampoco insiste. Algo se endurece en su mirada. «Ya hablaremos tú y yo. Sígueme.»',go:'E7'}]},
E7:{m:'fog',e:'💀',snd:1,t:'Los Ahogados se deshacen en espuma, uno a uno, como si alguien tirase de ellos hacia abajo. En la bruma, sobre la proa del Réquiem, aparece una figura alta con uniforme de almirante, goteando, con una corona de coral rota.\n\n«Capitana Calavera», dice una voz que sale del agua misma. «Tres noches. Devuelve lo que el Cuervo robó o me llevaré el barco y a todos los que van en él. Esta vez no te dejaré huir.»\n\nEl Réquiem se disuelve en la niebla. Solo queda la campana, muy lejos.',o:[{t:'Seguir a la Capitana a la bodega',go:'E8'}]},
E8:{m:'calm',e:'🗺️',t:'La bodega huele a manzanas viejas y a miedo. La tripulación, vendada y callada, rodea un barril que hace de mesa. La Capitana apoya la brújula encima.\n\n«Nos hunden en tres noches o llegamos antes a la Isla Durmiente», dice. «La brújula sabe el camino.»\n\nCuchillo se levanta. «Entregad la brújula al Almirante y que nos deje en paz. No arriesgaré treinta vidas por un mapa de cuento.»\n\nDe pronto todos miran hacia ti. Eres el único que ha tocado la brújula.',o:[
{t:'Hablar en favor de la Capitana',req:{a:'l',v:2},fx:{crew:2,conf:1,d:'Hablé en el consejo a favor de seguir la brújula.'},x:'Tu voz se quiebra al empezar y se afirma al terminar. Cuando acabas, la bodega guarda silencio y alguien murmura «el crío tiene razón». La Capitana asiente, apenas.',go:'E9'},
{t:'Quedarte callado y escuchar',fx:{crew:-1},x:'Cuchillo y la Capitana se desafían con la mirada. Gana la Capitana, pero la mitad de la tripulación aparta la vista. Hay votos que no se dijeron.',go:'E9'},
{t:'Darle la razón a Cuchillo',fx:{crew:1,conf:-1,f:'conCuchillo',d:'Apoyé a Cuchillo en el consejo.'},x:'«Tiene razón», dices, y notas la mirada de la Capitana como una piedra en la espalda. Cuchillo sonríe de lado. Pierde la votación, pero ya lo ha apuntado.',go:'E9'}]},
E9:{m:'cabin',e:'🍲',p:1,fx:{d:'Visión de la sopa de recuerdos: mi padre dijo «sigue el norte que no es norte».'},t:'Más tarde, en la cocina, Madame Ximena sirve un caldo humeante que huele a todo lo que has perdido. «Sopa de recuerdos, criatura. Tómala despacio y no te ahogues.»\n\nAl primer sorbo, la cocina se disuelve. Ves un puerto, un hombre alto que te sube a hombros, una brújula de latón en su mano. Oyes su voz: «Si algún día me pierdo, sigue el norte que no es norte.»\n\nTe despiertas con la cuchara temblando y el cuenco vacío.',o:[{t:'Darle las gracias y salir a cubierta',go:'E10'}]},
E10:{m:'dawn',e:'🌅',t:'Amanece sobre un mar color ceniza. El Cuervo Insomne navega rumbo oeste, sin más compañía que la brújula y los gritos de las gaviotas. En el palo mayor, Pipas se acicala con aire solemne.\n\n«Dos noches, {n}. Y un mar que no figura en ningún mapa. No será aburrido.»\n\nSabes que ya no eres solo un grumete. Eres el hijo de Elías Marrero, y el Cuervo navega hacia lo que él dejó atrás.',o:[{t:'Seguir el rumbo',go:'E11'}]},
E11:{m:'fog',e:'⚰️',p:1,t:'Al segundo día, el Cuervo se interna en una niebla verde donde flotan cascos hundidos con los mástiles al aire: el Cementerio de Mástiles. Esqueletos con sombrero guardan cofres sobre cubiertas podridas. Una campana de bronce cuelga de una verga y la brújula tira de ti hacia ella.\n\nPipas susurra: «Yo no toco nada. Bueno, casi nada.»',o:[
{t:'Resolver el puzle de la campana',h:'cam',r:{a:'i',d:7,go:'E11',okfx:{f:'cam',i:'Pieza de mapa',d:'En el Cementerio de Mástiles conseguí una pieza del mapa de la isla.'},okx:'Notas que cada campanada coincide con una marca del casco. La tocas en orden, y la verga se abre: dentro, una pieza de mapa envuelta en cuero.',kofx:{f:'cam',hp:1},kox:'Tocas mal y la campana te devuelve un estruendo que casi te revienta los oídos. Algo se mueve entre los cascos.'}},
{t:'Registrar el cofre del esqueleto',h:'cof',fx:{f:'cof',p:2,mor:-1},x:'El esqueleto no protesta. Dentro hay dos pipas y un doblón negro. Al cerrar la tapa juras que su calavera te sigue con las cuencas vacías.',go:'E11'},
{t:'Seguir el rumbo sin mirar atrás',go:'E12'}]},
E12:{m:'fog',e:'🧜‍♀️',t:'Entre dos cascos, una red de pesca arrastra a una sirena de escamas verdes. Forcejea sin fuerzas. Te mira a ti, solo a ti.\n\n«Cortad esa red, hijo de la brújula», susurra. «El mar paga sus deudas.»',o:[
{t:'Cortar la red y liberarla',fx:{mor:1,f:'nereida',d:'Liberé a Nereida, la sirena. Me debe una.'},x:'La red cede. Nereida te roza la mano con una aleta fría. «Me llamo Nereida. Cuando me necesites, canta a la brújula.» Se hunde sin una gota de espuma.',go:'E13'},
{t:'Pedirle algo a cambio',fx:{mor:-1,i:'Perla de sirena',f:'nereidaPaga'},x:'La sirena sonríe sin calidez. «Qué listo.» Te lanza una perla pequeña y negra, y desaparece. No sabes si la perla es un regalo o una deuda.',go:'E13'},
{t:'Pasar de largo',fx:{mor:-1},x:'Apartas la vista. Su canto te sigue un rato, bajito, hasta que lo apaga la niebla.',go:'E13'}]},
E13:{m:'calm',e:'🦀',p:2,t:'Puerto Cangrejo: casas colgadas de un acantilado, farolillos de aceite y un olor a pescado, pólvora y mentiras. La tripulación baja a tierra a por provisiones. En la taberna El Ancla Tuerta ríen y apuestan; en un callejón, una adivina te hace señas con un dedo torcido.',o:[
{t:'Jugar a los dados con pipas',h:'dd',req:{p:1},r:{a:'l',d:7,go:'E13',okfx:{f:'dd',p:2},okx:'Pones cara de tonto y los marineros se confían. Ganas dos pipas y un par de enemigos.',kofx:{f:'dd',p:-1},kox:'Los dados te traicionan y pierdes una pipa. Pipas desde tu hombro: «Cobarde. Yo habría hecho trampas.»'}},
{t:'Visitar a Doña Tinta, la adivina',h:'tin',fx:{f:'tin',d:'Doña Tinta: uno de los míos me traicionará por amor a otros.'},x:'Doña Tinta lee el fondo de tu taza. «Uno de los tuyos te traicionará, pero por amor a otros, no a ti. Y tu sangre guarda un secreto bajo el agua.» Te cobra una sonrisa y se ríe.',go:'E13'},
{t:'Volver al muelle',go:'E14'}]},
E14:{m:'dawn',e:'⚖️',t:'En el muelle, un cartel nuevo: SE BUSCA EL CUERVO INSOMNE Y SU BRÚJULA. La teniente Aldana, de la Armada del Rey, inspecciona barcos con cuatro soldados. Está a veinte pasos de vuestra pasarela.',o:[
{t:'Disfrazarte de estibador',r:{a:'i',d:6,go:'E15',okx:'Con un saco al hombro y la gorra calada, la teniente pasa a tu lado sin verte.',kofx:{f:'buscado'},kox:'El saco se rompe y ruedan manzanas por el muelle. Aldana te mira un segundo de más. Se ha fijado.'}},
{t:'Distraer a la teniente con una historia',r:{a:'l',d:7,go:'E15',okx:'Le cuentas una historia tan larga y absurda sobre una gallina robada que Aldana se retira con dolor de cabeza.',kofx:{f:'buscado'},kox:'Aldana no se traga ni media palabra. Entrecierra los ojos y apunta algo en su libreta.'}},
{t:'Sobornarla con pipas',req:{p:2},fx:{p:-2,mor:-1},x:'La teniente mira las pipas, luego a ti, y se las guarda con un suspiro. «No he visto nada, grumete.» Te mira como si te diese pena.',go:'E15'}]},
E15:{m:'cabin',e:'🕯️',t:'De noche, ya de vuelta a bordo, oyes voces tras un barril de la bodega. Cuchillo habla bajo con seis marineros: la Capitana nos llevará al fondo del mar, la Armada ofrece indulto, un pacto, mañana entregamos la brújula y volvemos a casa.\n\nTe quedas helado. Entonces Cuchillo dice tu nombre.',o:[
{t:'Avisar a la Capitana',fx:{conf:2,crew:-1,f:'avisaste',d:'Avisé a la Capitana del motín de Cuchillo.'},x:'Sales de puntillas y corres a su camarote. La Capitana te escucha en silencio. «Gracias, grumete. Ahora duerme, y no cuentes a nadie que lo sabes.»',go:'E16'},
{t:'Unirte al motín',fx:{crew:2,conf:-2,f:'unido',d:'Me uní a Cuchillo en el motín.'},x:'Das un paso adelante. Cuchillo sonríe. «Sabía que eras de los nuestros.» Pipas, en tu hombro, murmura: «Qué mal huele el aire cuando alguien traiciona.»',go:'E16'},
{t:'Sabotear su plan',r:{a:'i',d:7,go:'E16',okfx:{f:'sabotaje',crew:1},okx:'Mojas la pólvora de dos barriles y escondes las llaves del pañol. Cuchillo tendrá que improvisar.',kofx:{hp:1},kox:'Un marinero te pilla y te da un golpe seco. «Duerme, enano.»'}},
{t:'Callarte y esperar',x:'Aguantas la respiración hasta que se van. Mañana, pase lo que pase, ya no podrás decir que no lo sabías.',go:'E16'}]},
E16:{m:'storm',e:'🦑',t:'El tercer día amanece negro. De pronto, el mar se hincha bajo el casco y un tentáculo del grosor de un mástil emerge, cubierto de ventosas, y envuelve el palo mayor. El Kraken. La tripulación grita. La Capitana ordena fuego. Los cañones suenan sin efecto.\n\nEl tentáculo apunta hacia ti y hacia la brújula.',o:[
{t:'Clavar un arpón en el tentáculo',r:{a:'c',d:8,go:'E17',dead:'M1',okfx:{crew:2,f:'kraken'},okx:'Con las dos manos y un grito, hundes el arpón en la carne gris. El Kraken se retuerce y suelta el mástil. Los marineros te vitorean.',kofx:{hp:1},kox:'El tentáculo te lanza contra la borda. Te ahogas un segundo entre espuma y astillas, y te levantas con la vista borrosa.'}},
{t:'Prender los barriles de pólvora',r:{a:'i',d:7,go:'E17',dead:'M1',okfx:{crew:2,f:'kraken'},okx:'Rueda un barril hasta el tentáculo y, desde el alcázar, le prende fuego con un cañonazo. La explosión hace huir al monstruo hacia lo hondo.',kofx:{hp:1},kox:'La mecha prende demasiado pronto. Te lanzas al suelo, pero la onda te quema los brazos.'}},
{t:'Cantar a la brújula para llamar a Nereida',if:'nereida',fx:{crew:2,f:'kraken',d:'Nereida calmó al Kraken con su canto.'},x:'Cantas, sin voz, a la brújula. En el agua se alza un coro dulce y triste. Nereida aparece sobre las olas y el Kraken, como un niño al que arrullan, se deja caer en la oscuridad.',go:'E17'}]},
M1:{m:'storm',e:'💀',t:'El tentáculo te agarra de la cintura y tira de ti hacia abajo. El agua se cierra sobre tu cabeza. Lo último que ves es la luz del día alejándose, como una moneda en un pozo.\n\nEl mar te reclama.',o:[{t:'Volver al ataque del Kraken',fx:{hp:-3},go:'E16'}]},
E17:{m:'calm',e:'🧂',t:()=>'Esa noche, con el barco herido y la tripulación dormida a ratos, la Capitana te encuentra en cubierta. '+(G.conf>=1?'Se quita el guante y te enseña la mano: sal blanca y coral rosa donde debería haber piel. «La maldición del Corazón», dice. «Cada noche avanza.»':'Por un descuido, el guante se le ha rasgado y ves su mano: sal blanca y coral rosa donde debería haber piel. Ella la oculta rápido, pero ya lo has visto.')+'\n\n«Elías no me traicionó», murmura. «Me lo llevé a la isla yo misma, y no he podido perdonármelo.»',o:[
{t:'Prometerle que la ayudarás',fx:{conf:1,mor:1,d:'La Capitana tiene una mano de sal y coral. Dice que Elías no la traicionó.'},x:'«No prometas lo que no sabes si puedes cumplir», dice. Pero se queda a tu lado hasta que sale el sol.',go:'E18'},
{t:'Preguntarle por tu padre',fx:{d:'La Capitana llevó a Elías a la isla; se culpa de lo que pasó.'},x:'«Era el mejor hombre del Cuervo», dice. «Se quedó guardando el Corazón para que el mar no se vengase. Cuando lo vi por última vez... ya empezaba a ser coral.»',go:'E18'}]},
E18:{m:'storm',e:'🏴‍☠️',t:()=>(G.fl.avisaste?'La Capitana esperaba el motín y aun así llega tarde: Cuchillo y sus hombres ya tienen las armas. ':'En plena madrugada, Cuchillo y sus hombres toman el puente con las armas desnudas. ')+'La Capitana es desarmada y arrastrada hasta el calabozo. «Nada personal», dice Cuchillo. «Solo quiero que todos volvamos a casa.»\n\nTodos te miran. Es el momento de elegir bando.',o:[
{t:'Ponerte del lado de la Capitana',fx:{f:'bandoCap',conf:1,crew:-1,d:'Me puse del lado de la Capitana en el motín.'},x:'«Soy de la Capitana», dices. Cuchillo suspira. «Qué lástima.» Dos marineros te empujan al calabozo con ella.',go:'E19'},
{t:'Quedarte con Cuchillo',fx:{f:'bandoC',conf:-1,crew:1,d:'Me quedé del lado de Cuchillo en el motín.'},x:'Te colocas junto a Cuchillo. Pipas, desde la percha: «Hace falta valor para elegir mal, y tú lo tienes.»',go:'E19'}]},
E19:{m:'cabin',e:'⛓️',t:'Bajo cubierta, el calabozo huele a humedad. Los barrotes gotean. Es la hora de decidir cómo salir adelante.',o:[
{t:'Escapar con ayuda de Ximena y Pipas',if:'bandoCap',r:{a:'i',d:6,go:'E20',okfx:{f:'libre',crew:1},okx:'Ximena te lanza una cuchara con una llave pegada y Pipas distrae al guardia con un graznido perfecto de capitán. La cerradura cede.',kofx:{hp:1},kox:'La llave se atasca. Forcejeas hasta que la cerradura salta, pero el ruido atrae a un marinero que te golpea al salir.'}},
{t:'Liberar a la Capitana en secreto',if:'bandoC',r:{a:'i',d:6,go:'E20',okfx:{f:'libre',conf:1},okx:'Con una excusa y un cubo de agua, apartas al guardia. La Capitana te mira con sorpresa al abrir la reja. «No esperaba esto de ti.»',kofx:{hp:1,conf:-1},kox:'El guardia te pilla con la llave. Te echan de un empujón, pero la Capitana ya ha oído tus intenciones.'}}]},
E20:{m:'storm',e:'🗡️',t:'La noche del motín: lluvia, rayos y marineros inquietos en cada esquina. Para llegar al puente y a Cuchillo, hay que cruzar la cubierta entera sin que nadie dé la alarma.',o:[
{t:'Arrastrarte entre las sombras',r:{a:'i',d:7,go:'E21',okx:'Te pegas a las barandillas, rodeas a los vigías y, con Pipas callado por una vez, llegas al puente sin una sola mirada.',kofx:{hp:1,crew:-1},kox:'Un relámpago te delata. Te atrapan dos hombres antes de que puedas explicarte.'}},
{t:'Cruzar de frente con la cabeza alta',r:{a:'c',d:7,go:'E21',okfx:{crew:1},okx:'Avanzas como quien tiene derecho a estar ahí. Nadie se atreve a pararte.',kofx:{hp:1},kox:'Alguien te corta el paso y te cuesta un empujón y un moratón llegar hasta el puente.'}},
{t:'Hacerte pasar por un mensajero de Cuchillo',r:{a:'l',d:7,go:'E21',okx:'«Cuchillo me espera, imbéciles.» Se apartan sin discutir.',kofx:{hp:1},kox:'Nadie se lo traga. Te llevan a rastras hasta el puente a punta de daga.'}}]},
E21:{m:'fog',e:'🔪',t:'Cuchillo te espera junto al timón, con la brújula en la mano y la daga en la otra. Sin gritos, sin prisa.\n\n«Esto no iba de matar a nadie», dice. «El Almirante exige la brújula; la Armada nos perdona si se la damos. Treinta vidas por un trozo de latón. ¿Tan grave es?»',o:[
{t:'Convencerle de que hay otro camino',r:{a:'l',d:7,go:'E22',okfx:{f:'cuchilloConv',crew:2,d:'Convencí a Cuchillo de no entregar la brújula.'},okx:'Le hablas de tu padre, de la isla, de lo que de verdad quiere el Almirante. Cuchillo baja la daga. «Si me mientes, grumete...» «No te miento.»',kofx:{conf:-1},kox:'Cuchillo escucha, pero sacude la cabeza. «Ya es tarde, chaval.» Te aparta con el codo, sin violencia, pero sin duda.'}},
{t:'Batirte en duelo con él',r:{a:'c',d:8,go:'E22',dead:'M2',okfx:{f:'duelo',crew:1},okx:'Con una finta torpe y mucha suerte desarmas a Cuchillo. Él, tumbado, ríe. «Bien. Eres de los buenos.»',kofx:{hp:1},kox:'Cuchillo te sujeta la muñeca y la daga te roza el hombro. «No me obligues, chaval.»'}},
{t:'Dejarle hacer su plan',fx:{conf:-1,f:'cuchilloLibre'},x:'Te apartas. Cuchillo asiente, extrañamente decepcionado. «Pensé que serías más cabezota.»',go:'E22'}]},
M2:{m:'fog',e:'💀',t:'La daga de Cuchillo encuentra un hueco que no sabías que tenías. No grita, no insulta. Solo susurra: «Lo siento, chaval.»\n\nTodo se vuelve frío y silencioso.',o:[{t:'Volver al duelo',fx:{hp:-3},go:'E21'}]},
E22:{m:'fog',e:'👑',snd:1,t:'La campana vuelve a sonar bajo el agua. El Réquiem emerge junto al Cuervo, los dos cascos rozándose, y el Almirante Ahogado cruza la pasarela de agua sin mojarse. Se detiene frente a ti, frente a la brújula.\n\n«Mis hijos viajaban en mi flota», dice. «La Capitana nos abandonó en la tormenta. Los perdí a todos. Solo quiero que el mar me los devuelva.»',o:[
{t:'Escuchar su historia',fx:{mor:1,f:'escuchaAlm',d:'El Almirante perdió a sus hijos cuando el Cuervo abandonó su flota.'},x:'Te cuenta los nombres, uno a uno, de los chicos que se ahogaron. Cuando termina, notas que el mar, a vuestro alrededor, también escucha. «No es villano», murmura Pipas. «Es padre.»',go:'E23'},
{t:'Plantarle cara',fx:{crew:1},x:'«Nadie va a entregarte nada», dices con la voz de otro. El Almirante te mira como si viese a alguien muy parecido. «Entonces vendré a por ello.» Se esfuma en agua.',go:'E23'}]},
E23:{m:'storm',e:'🌀',t:'El mar se abre bajo ambos barcos en un remolino gigante. El Cuervo gira, cruje, se inclina. La aguja de la brújula apunta al centro del agujero.\n\n«No lo hagas», dice Pipas. «Hazlo.»',o:[
{t:'Atar el timón y confiar en la brújula',r:{a:'c',d:6,go:'E24',okfx:{crew:1},okx:'Te atas a la rueda del timón, aprietas los dientes y dejas que la brújula guíe. El barco cruza el ojo del remolino con un crujido largo y salvaje.',kofx:{hp:1},kox:'El timón te arranca las manos, pero la brújula no se equivoca. El Cuervo cruza el remolino y tú sales con las palmas en carne viva.'}},
{t:'Pedir ayuda a la tripulación',r:{a:'l',d:6,go:'E24',okfx:{crew:2},okx:'Tu grito atraviesa la tormenta. Cuchillo, la Capitana y media tripulación corren a cuerda y vela. Cruzáis juntos.',kofx:{hp:1},kox:'Nadie te oye, y casi no lo logras. Te salvas por un tirón de Pipas que agarra la soga entre las garras.'}}]},
E24:{m:'dawn',e:'🐢',t:'Del fondo del remolino emerge una isla enorme, cubierta de selva, con terrazas de piedra y ruinas cubiertas de coral. No es una isla. Cada cierto tiempo, el suelo entero sube y baja, como un pecho respirando.\n\n«Bienvenido a la Isla Durmiente», murmura la Capitana. «No hagas ruido. Todo esto es el lomo del Leviatán.»',o:[{t:'Mirar el horizonte y respirar hondo',go:'E25'}]},
FIN2:{m:'dawn',e:'🌅',t:'FIN DEL ACTO II\n\nLa isla respira bajo vuestros pies. Tres pruebas, un padre medio coral y la elección sobre el Corazón de la Marea os esperan.\n\nTus decisiones quedan guardadas en el Diario.',o:[{t:'Volver al inicio',go:'E0'}]},
E25:{m:'calm',e:'🌴',p:1,t:'Desembarcáis en una playa de arena tibia que sube y baja, despacio, como el pecho de un animal dormido. Selva densa, terrazas de piedra, lianas con flores del color de las perlas. Cada latido hace temblar el suelo y las hojas. Pipas no habla por una vez.\n\nLa brújula tira hacia el interior, ladera arriba, hacia un templo medio hundido en la selva.',o:[{t:'Seguir la aguja hasta el templo',go:'E26'}]},
E26:{m:'fog',e:'🦴',t:'PRUEBA DEL PUENTE DE HUESOS\n\nUn barranco sin fondo y, sobre él, un puente hecho de costillas gigantes que tiemblan con cada latido de la isla. Al otro lado, un arco de coral. Una voz, sin dueño, repite: «Quien cruza sin miedo, cruza solo».',o:[
{t:'Cruzar corriendo',r:{a:'c',d:7,go:'E27',dead:'M3',okfx:{f:'puente',crew:1},okx:'Corres sin pensar, saltando de hueso en hueso, y llegas al otro lado con los pulmones en llamas.',kofx:{hp:1},kox:'Un hueso se parte bajo tu pie. Te agarras con las manos y trepas, temblando, con los brazos arañados.'}},
{t:'Cruzar despacio, buscando el ritmo del latido',r:{a:'i',d:6,go:'E27',dead:'M3',okfx:{f:'puente'},okx:'Aprendes que el puente solo cede entre latidos. Avanzas al compás y cruzas sin un rasguño.',kofx:{hp:1},kox:'Te equivocas de compás y casi caes. Un reflejo te salva por los pelos.'}},
{t:'Pedirle a Cuchillo que te sujete con una cuerda',if:'cuchilloConv',fx:{crew:1,f:'puente',d:'Cuchillo me aseguró con una cuerda en el puente.'},x:'Cuchillo ata la cuerda a su cintura, sin una queja. «No te sueltes, chaval. A este lado, el que cruza solo es tonto.» Cruzas con su peso detrás.',go:'E27'}]},
M3:{m:'fog',e:'💀',t:'El hueso cede. No hay grito, solo el viento y un silencio muy largo. El barranco te traga con calma, como si llevase tiempo esperándote.',o:[{t:'Volver al puente',fx:{hp:-3},go:'E26'}]},
E27:{m:'calm',e:'🌊',t:'PRUEBA DE LAS MAREAS\n\nEn una plaza de piedra hay doce columnas bajas, hundidas en agua clara. Un cartel de coral dice: «Gira las piedras al ritmo del corazón». Cada latido de la isla las hace temblar. Si las giras mal, el agua sube.',o:[
{t:'Contar los latidos y girar las piedras',r:{a:'i',d:7,go:'E28',okfx:{f:'mareas'},okx:'Cuentas: tres latidos, pausa, dos. Giras las columnas en orden y el agua se aquieta. El suelo emite un suspiro de alivio.',kofx:{hp:1},kox:'Te equivocas dos veces y el agua te sube hasta el pecho. Sales empapado, con el orgullo hecho agua.'}},
{t:'Sostener la perla de sirena sobre el agua',if:'nereidaPaga',fx:{f:'mareas',mor:-1},x:'La perla brilla y el agua se parte en dos. Las columnas giran solas, como si te reconociesen. Algo te dice que has cobrado un favor que aún no has pagado.',go:'E28'},
{t:'Pagarle a Pipas una pipa para que cuente',req:{p:1},fx:{p:-1,f:'mareas'},x:'«Ocho latidos por pipa», dice Pipas, y cuenta sin parar mientras tú giras. Cuando termináis, se come la pipa y te mira. «No se lo digas a nadie, pero esto me ha divertido.»',go:'E28'}]},
E28:{m:'fog',e:'🪞',t:'PRUEBA DE LA VERDAD\n\nUn estanque redondo de agua negra. Al asomarte, no ves tu cara: ves la de un hombre alto, con los mismos ojos que tú. Una voz sin cuerpo pregunta: «¿Quién eres, {n}?»',o:[
{t:'Decir toda la verdad: soy el hijo de Elías Marrero',fx:{f:'verdadEspejo',conf:1,mor:1,d:'Dije mi verdad ante el espejo de agua.'},x:'Lo dices en voz alta, por primera vez, ante el agua y ante la isla. El rostro de tu padre sonríe. Una puerta de coral se abre en la pared de la gruta.',go:'E29'},
{t:'Mentir: «Soy solo un grumete»',r:{a:'l',d:8,go:'E29',okfx:{f:'mintio'},okx:'La mentira sale redonda y limpia, y el espejo calla. Una puerta de coral se abre. Pero sientes que algo, al otro lado, ya sabe que mentiste.',kofx:{hp:1,conf:-1},kox:'El agua se agita. «No sabes mentir ante el mar», murmura la voz. Una ola te golpea en la cara y la puerta se abre a regañadientes.'}}]},
E29:{m:'cabin',e:'🪸',p:1,t:'La cámara del Corazón es una cueva circular iluminada por una luz rosa que late. En el centro, sobre un pedestal de coral, una gema del tamaño de un puño, roja y viva, bombea luz con cada latido de la isla. A su alrededor, un círculo de coral. Dentro del círculo, de pie, una figura: un hombre alto con barba blanca, medio hecho de coral, con una brújula idéntica a la tuya colgada del cuello.\n\n«Lo sabía», susurra. «Sabía que vendrías.»',o:[{t:'Acercarte a él',go:'E30'}]},
E30:{m:'cabin',e:'🧔',t:'Elías Marrero te mira como si el tiempo no hubiera pasado. Las manos le crujen cuando las mueve; de la cintura para abajo ya es coral.\n\n«Guardo el Corazón desde hace diez años. Si lo arranco, el Leviatán despierta y el mar se vuelve loco. Si alguien lo usa, el mar se vuelve suyo. Si alguien lo devuelve a su sitio... la isla vuelve a dormir y yo, por fin, descanso.»',o:[
{t:'Abrazarle',h:'ab',fx:{f:'abrazo',mor:1,d:'Abracé a mi padre, medio coral.'},x:'Su abrazo es duro como una roca y cálido como un hogar. No hace falta decir nada. Los dos lloráis, y la isla, bajo vuestros pies, parece contener la respiración.',go:'E30'},
{t:'Preguntarle por qué se quedó',h:'pq',fx:{f:'pq',d:'Mi padre se quedó para que el mar no se vengara.'},x:'«Porque tenía que ser alguien. Y porque tú ibas a nacer en un mar que no se ahogase por mi culpa.» Sonríe. «Valió la pena, aunque no lo sepas.»',go:'E30'},
{t:'Pedirle que vuelva contigo',h:'vu',fx:{f:'vu'},x:'«Ya no puedo, hijo. El coral es mi casa ahora.» Te toca la mejilla con una mano de piedra tibia. «Pero puedes quedarte, si quieres. Para eso están los guardianes.»',go:'E30'},
{t:'Oír pasos en la selva',go:'E31'}]},
E31:{m:'storm',e:'⚔️',t:'La luz del Corazón se vuelve violeta. Desde tres puntos de la selva llegan pasos y gritos: el Almirante Ahogado, a la cabeza de sus Ahogados; Cuchillo con los suyos; la teniente Aldana, con soldados del Rey. Todos quieren lo mismo. Todos miran hacia la gema.',o:[
{t:'Pedir al Almirante que escuche a tu padre',if:'escuchaAlm',fx:{f:'almCalma',crew:1},x:'El Almirante frena a sus hombres con un gesto. «Hablarás tú. Y yo escucharé.» Los Ahogados bajan los ganchos, sorprendidos de que esa mano pueda ser amable.',go:'E32'},
{t:'Llamar a la Capitana y a la tripulación',fx:{f:'llamas',conf:1},x:'Un silbido largo, el de la Marea. Desde la selva responde su voz. «Aquí, grumete.» Llega con el sable y la mano de sal alzada. Tu tripulación está contigo.',go:'E32'},
{t:'Esperar a ver quién se mueve primero',x:'Nadie respira. El latido de la isla es el único ruido. Entonces alguien dispara, y se rompe todo.',go:'E32'}]},
E32:{m:'storm',e:'⚓',t:()=>'La batalla estalla bajo el latido de la isla: ganchos, sables, cañones, espuma. '+(G.fl.ximena?'Madame Ximena aparece con una sartén y un caldero de sopa hirviendo. ':'')+(G.fl.nereida?'Nereida canta desde el agua y hace tropezar a los Ahogados. ':'')+(G.fl.cuchilloConv?'Cuchillo lucha a tu lado, con la daga y media sonrisa. ':'')+'\n\nEn medio del caos, solo tú estás lo bastante cerca del Corazón para decidir.',o:[
{t:'Luchar a pecho descubierto',r:{a:'c',d:7,go:'E33',okfx:{crew:2},okx:'Tu grito levanta a los tuyos. La línea de los Ahogados se rompe y la tripulación avanza tras de ti.',kofx:{hp:1},kox:'Te hieren, pero no caes. Tus compañeros te cubren y consiguen que llegues vivo al pedestal.'}},
{t:'Usar el terreno y la brújula',r:{a:'i',d:7,go:'E33',okfx:{crew:1,mor:1},okx:'Atraes a los Ahogados hacia las columnas de las Mareas. El agua sube y los arrastra sin hacerles daño.',kofx:{hp:1},kox:'Te equivocas en un giro y una ola os barre a todos. Salís vivos, pero maltrechos.'}},
{t:'Gritar a todos que bajen las armas',r:{a:'l',d:8,go:'E33',okfx:{crew:2,mor:1},okx:'Tu voz, quebrada, sube sobre el estruendo: «¡Ese corazón es de mi padre!» Por un instante, todos se detienen a mirarte.',kofx:{hp:1},kox:'Nadie te oye entre el ruido, pero tu grito atrae la atención de Elías, que alza la mano y detiene el temblor.'}}]},
E33:{m:'cabin',e:'💗',t:'La batalla se queda en suspenso. Todos te miran. El Corazón late en su pedestal, a un paso de tu mano. Tu padre te hace un gesto de ánimo desde el coral. La Capitana baja el sable. La brújula, en tu pecho, apunta a la gema.\n\nEl destino del mar, de la isla y de todos los que te rodean está en tus manos. ¿Qué haces con el Corazón de la Marea?',o:[
{t:'Devolverlo al Leviatán',c:()=>G.conf>=1&&G.mor>=0,go:'F1'},
{t:'Quedarte con tu padre como guardián',c:()=>G.fl.abrazo||G.fl.verdadEspejo,go:'F2'},
{t:'Quedártelo y usar su poder',go:'F3'},
{t:'Fundirte con el mar junto a Nereida',c:()=>G.fl.nereida,go:'F4'},
{t:'Entregárselo al Almirante',c:()=>G.fl.escuchaAlm,go:'F5'},
{t:'Pedir el indulto para la tripulación',c:()=>G.fl.cuchilloConv,go:'F6'},
{t:'Darle todas tus pipas a Pipas',c:()=>G.pip>=8,go:'F7'}]},
F1:{m:'dawn',e:'👩‍✈️',end:'1',t:'FINAL 1 DE 7: LA CAPITANA DE LA MAREA\n\nColocas el Corazón en el pecho del Leviatán. La isla suspira, larga, y el mar entero se aquieta. Tu padre, aliviado, sonríe y cierra los ojos entre las olas de coral. La mano de la Capitana se llena de color. Meses después, en el timón del Cuervo, con el sombrero de pluma de gaviota que ella te regaló, navegas hacia un mar que ya no teme a nadie.',o:[{t:'Volver al inicio',go:'E0'}]},
F2:{m:'cabin',e:'🧔',end:'2',t:'FINAL 2 DE 7: EL GUARDIÁN\n\nTe quedas. Tu padre te enseña a escuchar los latidos y a calmar al Leviatán. El Cuervo parte sin ti, con la Capitana a bordo y una brújula que apunta siempre a la isla. Pipas vuelve cada primavera con una semilla en el pico y noticias del mundo. Es una vida pequeña y larga, y no la cambiarías por nada.',o:[{t:'Volver al inicio',go:'E0'}]},
F3:{m:'storm',e:'👑',end:'3',t:'FINAL 3 DE 7: REY SIN CORONA\n\nEl Corazón te susurra órdenes y el mar las cumple. Una flota entera se levanta de las profundidades. Ganas batallas, tesoros y respeto. Cuando miras atrás, cada amigo se ha ido a otro barco. El trono de espuma es muy ancho y muy frío, y nadie se atreve a sentarse a tu lado.',o:[{t:'Volver al inicio',go:'E0'}]},
F4:{m:'fog',e:'🧜‍♀️',end:'4',t:'FINAL 4 DE 7: HIJO DE LA MAREA\n\nNereida te toma de la mano y el Corazón se hace agua en tu pecho. Dejas de ser grumete, hombre y sombra. Los marineros jurarán, durante siglos, que cuando el mar canta en las noches de niebla, una de las voces suena a niño que busca a su padre.',o:[{t:'Volver al inicio',go:'E0'}]},
F5:{m:'storm',e:'⚓',end:'5',t:'FINAL 5 DE 7: EL PACTO DEL ALMIRANTE\n\nLe tiendes el Corazón al Almirante. Sus hijos emergen del agua, grises y callados, y se abrazan a él. Pero el mar, privado de su corazón, se vuelve oscuro y despiadado. El Cuervo navega muchos años sin más luz que la de su farol, y tú, en la proa, nunca sabes si hiciste un bien.',o:[{t:'Volver al inicio',go:'E0'}]},
F6:{m:'dawn',e:'📜',end:'6',t:'FINAL 6 DE 7: EL INDULTO\n\nAldana lee una carta con el sello del Rey: indulto completo para el Cuervo Insomne a cambio de que el Corazón regrese al Leviatán. Cuchillo se quita el sombrero. Madame Ximena llora sobre su sartén. Por primera vez en diez años, el Cuervo entra en un puerto con la bandera alta y las puertas abiertas.',o:[{t:'Volver al inicio',go:'E0'}]},
F7:{m:'dawn',e:'🦜',end:'7',t:'FINAL 7 DE 7: EL LORO QUE FUE CAPITÁN\n\nVacías tus bolsillos delante de Pipas. Las pipas brillan, el loro las mira y, por primera vez, no se las come. «Gracias, {n}», dice con una voz muy distinta. «Hace muchos años que nadie me daba nada sin pedir algo a cambio.» La maldición se rompe en un destello. Ante ti hay un hombre de barba gris y sombrero de capitán, Baltasar, el primero del Cuervo. Te entrega las llaves del barco con una reverencia.',o:[{t:'Volver al inicio',go:'E0'}]},
FIN1:{m:'calm',e:'🌊',t:'FIN DEL ACTO I\n\nEl Mar de los Olvidados te espera: cementerios de mástiles, una sirena atrapada, un motín y un kraken.\n\nTus decisiones quedan guardadas en el Diario.',o:[{t:'Volver al inicio',go:'E0'}]}
};
hud();intro();
</script></body></html>
